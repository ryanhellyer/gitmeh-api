nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin:
            - 'https://translate.hellyer.kiwi'
            - 'https://translate.hellyer.test'
        allow_methods: ['POST', 'OPTIONS']
        allow_headers: ['Content-Type']
        expose_headers: []
        max_age: 3600
    paths:
        '^/v1/':
            allow_origin:
                - 'https://translate.hellyer.kiwi'
                - 'https://translate.hellyer.test'
            allow_methods: ['POST', 'OPTIONS']
            allow_headers: ['Content-Type']
